<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchlist - Cinephile Lite</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sticky top bar with links to the 3 pages -->
  <header>
    <nav><strong>🎬 Cinephile Lite</strong><a href="index.html">Home</a><a href="diary.html">Diary</a><a class="active" href="watchlist.html">Watchlist</a></nav>
  </header>
  <main>
    <h1>Watchlist</h1>
    <!-- Form: one pill-shaped row to add a movie to watch later -->
    <section>
      <form id="form" class="pill">
        <input id="title" aria-label="Movie title" placeholder="Movie to watch..." required maxlength="200">
        <button>Add</button>
      </form>
      <p class="error" id="error"></p>
    </section>
    <!-- The saved movies are drawn here -->
    <section class="rows" id="list"></section>
  </main>
  <footer>Web Technology Lab Project</footer>
  <script>
    const list = document.getElementById('list');
    const error = document.getElementById('error');

    // Asks the server for all watchlist rows and draws one row for each.
    async function load() {
      const res = await fetch('/api/watchlist');
      const movies = await res.json();
      list.textContent = ''; // clear old rows
      movies.forEach((m) => {
        const row = document.createElement('div');
        row.className = 'row';
        const name = document.createElement('span');
        name.textContent = m.title; // textContent is safe from XSS
        const del = document.createElement('button');
        del.textContent = 'Remove';
        // Remove button: DELETE request, then redraw
        del.addEventListener('click', async () => {
          await fetch('/api/watchlist/' + m.id, { method: 'DELETE' });
          load();
        });
        row.append(name, del);
        list.append(row);
      });
    }

    // When the form is sent: check the title, POST it, redraw.
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault(); // stop the page reload
      const title = document.getElementById('title').value.trim();
      if (!title) { error.textContent = 'Please type a title'; return; }
      const res = await fetch('/api/watchlist', { method: 'POST', body: JSON.stringify({ title }) });
      error.textContent = res.ok ? '' : 'Could not save';
      e.target.reset();
      load();
    });
    load();
  </script>
</body>
</html>
