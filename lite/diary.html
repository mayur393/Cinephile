<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diary - Cinephile Lite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top bar with links to the 3 pages -->
  <header>
    <nav><strong>Cinephile Lite</strong><a href="index.html">Home</a><a href="diary.html">Diary</a><a href="watchlist.html">Watchlist</a></nav>
  </header>
  <main>
    <h1>Movie Diary</h1>
    <!-- Form: used for both Add and Edit -->
    <section>
      <form id="form">
        <input id="title" placeholder="Movie title" required maxlength="200">
        <input id="date" type="date" required>
        <input id="rating" type="number" min="1" max="5" placeholder="Rating (1-5)" required>
        <textarea id="review" placeholder="Short review"></textarea>
        <input id="poster" placeholder="Poster image URL (optional)">
        <button>Save</button>
        <span class="error" id="error"></span>
      </form>
    </section>
    <!-- The saved movies are drawn here -->
    <section class="cards" id="list"></section>
  </main>
  <footer>Web Technology Lab Project</footer>
  <script>
    const list = document.getElementById('list');
    const error = document.getElementById('error');
    const MIN_RATING = 1, MAX_RATING = 5;
    const PLACEHOLDER = 'https://placehold.co/200x240?text=No+Poster';
    let editId = null; // null = adding, a number = editing that movie

    // Gets a form field by id.
    const field = (id) => document.getElementById(id);

    // Asks the server for all diary rows and draws one card for each.
    async function load() {
      const res = await fetch('/api/diary');
      const movies = await res.json();
      list.textContent = ''; // clear old cards
      movies.forEach((m) => {
        const card = document.createElement('div');
        card.className = 'card';
        const img = document.createElement('img');
        img.src = m.poster_url || PLACEHOLDER;
        img.alt = m.title;
        img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER; }; // broken link -> placeholder
        const name = document.createElement('h3');
        name.textContent = m.title;
        const info = document.createElement('p');
        info.textContent = m.watched_date + ' - ' + m.rating + '/5';
        const review = document.createElement('p');
        review.textContent = m.review;
        const edit = document.createElement('button');
        edit.textContent = 'Edit';
        // Edit button: copy the movie into the form; Save will then send a PUT
        edit.addEventListener('click', () => {
          field('title').value = m.title;
          field('date').value = m.watched_date;
          field('rating').value = m.rating;
          field('review').value = m.review;
          field('poster').value = m.poster_url;
          editId = m.id;
          window.scrollTo(0, 0);
        });
        const del = document.createElement('button');
        del.textContent = 'Delete';
        // Delete button: DELETE request, then redraw
        del.addEventListener('click', async () => {
          await fetch('/api/diary/' + m.id, { method: 'DELETE' });
          load();
        });
        card.append(img, name, info, review, edit, del);
        list.append(card);
      });
    }

    // When the form is sent: check the rating, then POST (add) or PUT (edit).
    field('form').addEventListener('submit', async (e) => {
      e.preventDefault(); // stop the page reload
      const rating = Number(field('rating').value);
      if (rating < MIN_RATING || rating > MAX_RATING) { error.textContent = 'Rating must be 1 to 5'; return; }
      const movie = { title: field('title').value.trim(), watched_date: field('date').value, rating,
        review: field('review').value, poster_url: field('poster').value };
      const url = editId ? '/api/diary/' + editId : '/api/diary';
      const res = await fetch(url, { method: editId ? 'PUT' : 'POST', body: JSON.stringify(movie) });
      error.textContent = res.ok ? '' : 'Could not save';
      if (res.ok) { e.target.reset(); editId = null; }
      load();
    });
    load();
  </script>
</body>
</html>
