<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Movie Diary – Cinephile Lite</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <strong>🎬 Cinephile Lite</strong>
      <a href="dashboard.html">Dashboard</a>
      <a class="active" href="diary.html">Movie Diary</a>
      <a href="watchlist.html">Watchlist</a>
      <a class="btn-outline btn-sm" href="index.html">Logout</a>
    </nav>
  </header>

  <main>
    <h1 style="margin-bottom: 12px;">Movie Diary</h1>

    <!-- Form for Add and Edit -->
    <section class="form-card">
      <form id="form">
        <input id="title" placeholder="Movie title" required maxlength="200">
        <input id="date" type="date" required>
        <input id="rating" type="number" min="1" max="5" placeholder="Rating (1-5)" required>
        <input id="poster" placeholder="Paste poster image URL here...">
        <!-- Live Poster Preview -->
        <div id="poster-preview" class="poster-preview-box">
          <img id="preview-img" alt="Poster preview">
          <span id="preview-status">Poster preview</span>
        </div>
        <textarea id="review" placeholder="Personal review"></textarea>
        <div style="display: flex; gap: 8px;">
          <button id="save-btn">Save</button>
          <button type="button" id="cancel-btn" class="btn-outline" style="display: none;" onclick="cancelEdit()">Cancel</button>
        </div>
        <p class="error" id="err"></p>
      </form>
    </section>

    <!-- Movie Cards Grid -->
    <section class="grid" id="list"></section>
  </main>

  <footer>Web Technology Lab Project</footer>

  <script>
    const list = document.getElementById('list');
    const f = (id) => document.getElementById(id);
    let editId = null;

    // Default today's date
    f('date').value = new Date().toISOString().split('T')[0];

    // Live preview when URL is pasted into the box
    function updatePosterPreview(url) {
      const box = f('poster-preview');
      const img = f('preview-img');
      const status = f('preview-status');

      if (!url || !url.trim()) {
        box.style.display = 'none';
        img.src = '';
        return;
      }
      box.style.display = 'flex';
      status.textContent = 'Loading preview...';
      status.style.color = 'var(--muted)';
      img.referrerPolicy = 'no-referrer';
      img.src = url.trim();
      img.onload = () => {
        status.textContent = '✓ Poster loaded';
        status.style.color = '#16a34a';
      };
      img.onerror = () => {
        status.textContent = '⚠ Link cannot be loaded';
        status.style.color = 'var(--red)';
      };
    }

    f('poster').addEventListener('input', () => updatePosterPreview(f('poster').value));

    // Poster box with movie title fallback and no-referrer policy
    function makePoster(url, title) {
      const box = document.createElement('div');
      box.className = 'poster';
      const fallback = document.createElement('div');
      fallback.className = 'poster-fallback';
      fallback.innerHTML = `<span>🎬</span><strong class="fallback-title">${title || 'Movie'}</strong>`;
      box.append(fallback);

      if (url && url.trim()) {
        const img = document.createElement('img');
        img.referrerPolicy = 'no-referrer';
        img.src = url.trim();
        img.onload = () => { fallback.style.display = 'none'; };
        img.onerror = () => { img.remove(); fallback.style.display = 'flex'; };
        box.append(img);
      }
      return box;
    }

    // Load all diary entries from MySQL and draw cards
    async function load() {
      const res = await fetch('/api/diary');
      const movies = await res.json();
      list.textContent = '';
      movies.forEach((m) => {
        const card = document.createElement('div');
        card.className = 'card';
        const body = document.createElement('div');
        body.className = 'card-body';

        const name = document.createElement('h3');
        name.textContent = m.title;

        const stars = document.createElement('div');
        stars.className = 'stars';
        stars.textContent = '★'.repeat(m.rating) + '☆'.repeat(5 - m.rating);

        const date = document.createElement('div');
        date.className = 'muted';
        date.textContent = 'Watched: ' + m.watched_date;

        const rev = document.createElement('p');
        rev.textContent = m.review;

        const acts = document.createElement('div');
        acts.className = 'card-actions';

        const edit = document.createElement('button');
        edit.className = 'btn-outline btn-sm';
        edit.textContent = 'Edit';
        edit.onclick = () => {
          f('title').value = m.title;
          f('date').value = m.watched_date;
          f('rating').value = m.rating;
          f('poster').value = m.poster_url || '';
          updatePosterPreview(m.poster_url || '');
          f('review').value = m.review || '';
          editId = m.id;
          f('save-btn').textContent = 'Update';
          f('cancel-btn').style.display = 'inline-block';
          window.scrollTo(0, 0);
        };

        const del = document.createElement('button');
        del.className = 'btn-danger btn-sm';
        del.textContent = 'Delete';
        del.onclick = async () => {
          if (confirm('Delete ' + m.title + '?')) {
            await fetch('/api/diary/' + m.id, { method: 'DELETE' });
            load();
          }
        };

        acts.append(edit, del);
        body.append(name, stars, date, rev, acts);
        card.append(makePoster(m.poster_url, m.title), body);
        list.append(card);
      });
    }

    function cancelEdit() {
      editId = null;
      f('form').reset();
      f('date').value = new Date().toISOString().split('T')[0];
      updatePosterPreview('');
      f('save-btn').textContent = 'Save';
      f('cancel-btn').style.display = 'none';
      f('err').textContent = '';
    }

    // Submit form: POST (add) or PUT (edit)
    f('form').onsubmit = async (e) => {
      e.preventDefault();
      const movie = {
        title: f('title').value.trim(),
        watched_date: f('date').value,
        rating: Number(f('rating').value),
        poster_url: f('poster').value.trim(),
        review: f('review').value.trim()
      };
      const url = editId ? '/api/diary/' + editId : '/api/diary';
      const res = await fetch(url, { method: editId ? 'PUT' : 'POST', body: JSON.stringify(movie) });
      if (res.ok) { cancelEdit(); load(); }
      else { f('err').textContent = 'Could not save'; }
    };

    load();
  </script>
</body>
</html>
